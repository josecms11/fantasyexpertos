name: Motor Fantasy Expertos
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (datos); las noticias con IA se escriben cada hora
  workflow_dispatch:
permissions:
  contents: write
concurrency: motor
jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: motor
        run: node scripts/motor.mjs
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      - name: Páginas para Google (SEO)
        run: node scripts/paginas.mjs || echo "páginas con errores"
      - name: Newsletter semanal
        run: node scripts/newsletter.mjs || echo "newsletter con errores"
      - run: |
          git config user.name "fx-bot"
          git config user.email "fx-bot@users.noreply.github.com"
          git add -A data jugador noticia equipo sitemap.xml robots.txt
          git commit -m "Contenido automático $(date -u +%FT%TZ)" || exit 0
          git pull --rebase -X ours origin main || true
          git push
      - name: Alerta si el motor falló
        if: steps.motor.outcome == 'failure'
        run: |
          echo "::error::El motor de Fantasy Expertos falló en esta corrida. Revisa el log del paso 'motor'."
          exit 1
